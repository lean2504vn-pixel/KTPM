name: Maven JUnit 5 Selenium CI

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run functional tests (excluding known system bugs)
        working-directory: automation
        run: mvn clean test -Dheadless=true -DexcludedGroups=known-bug

      - name: Run known-bug verification tests (expected system bugs)
        working-directory: automation
        continue-on-error: true
        run: mvn test -Dheadless=true -Dgroups=known-bug

      - name: Upload Surefire Reports & Failure Screenshots as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            automation/target/surefire-reports/
            automation/target/screenshots/
          retention-days: 14
